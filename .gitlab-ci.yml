stages:
  - checkout
  - test
  - build
  - docker

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

default:
  tags:
    - kali-final

variables:
  GIT_STRATEGY: clone

checkout-job:
  stage: checkout
  script:
    - |
      set -eu
      echo '[CHECKOUT] Repository checkout completed'
      echo "[CHECKOUT] Commit: $(git rev-parse --short HEAD)"
      echo '[CHECKOUT] Website files:'
      ls -l website/

test-job:
  stage: test
  script:
    - |
      set -eu
      echo '[TEST] Checking website and Docker Compose configuration'
      bash scripts/check.sh

build-job:
  stage: build
  script:
    - |
      set -eu
      export IMAGE_TAG="sha-${CI_COMMIT_SHORT_SHA}-gl-${CI_PIPELINE_ID}"
      echo "[BUILD] Building image ${HUB_USER}/webserverdocker:${IMAGE_TAG}"
      bash scripts/build.sh

docker-job:
  stage: docker
  needs:
    - build-job
  script:
    - |
      set -eu
      export IMAGE_TAG="sha-${CI_COMMIT_SHORT_SHA}-gl-${CI_PIPELINE_ID}"
      echo '[DOCKER] Publishing image to Docker Hub'
      echo '[DOCKER] Deploying the full web server with Docker Compose'
      bash scripts/deploy.sh
